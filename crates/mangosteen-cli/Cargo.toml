[package]
name = "mangosteen-cli"
description = "Mangosteen 用户交互层：命令行与全屏 TUI（仅与 API 网关层交互）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "mangosteen"
path = "src/main.rs"

[dependencies]
mangosteen-core = { workspace = true }
mangosteen-platform = { workspace = true }
mangosteen-base = { workspace = true }
mangosteen-gateway = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
