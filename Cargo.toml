[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/base",
    "crates/session",
    "crates/local",
    "crates/backend",
    "crates/cloud",
    "crates/gateway",
    "crates/webui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Mangosteen Contributors"]
repository = "https://github.com/zhuzhichaoTM/mangosteen"

[workspace.dependencies]
mangosteen-core = { path = "crates/core" }
mangosteen-platform = { path = "crates/platform" }
mangosteen-base = { path = "crates/base" }
mangosteen-session = { path = "crates/session" }
mangosteen-local = { path = "crates/local" }
mangosteen-backend = { path = "crates/backend" }
mangosteen-cloud = { path = "crates/cloud" }
mangosteen-gateway = { path = "crates/gateway" }
mangosteen-webui = { path = "crates/webui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
