[workspace]
resolver = "2"
members = [
    "crates/mangosteen-core",
    "crates/mangosteen-platform",
    "crates/mangosteen-base",
    "crates/mangosteen-session",
    "crates/mangosteen-local",
    "crates/mangosteen-backend",
    "crates/mangosteen-cloud",
    "crates/mangosteen-gateway",
    "crates/mangosteen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Mangosteen Contributors"]
repository = "https://github.com/zhuzhichaoTM/mangosteen"

[workspace.dependencies]
mangosteen-core = { path = "crates/mangosteen-core" }
mangosteen-platform = { path = "crates/mangosteen-platform" }
mangosteen-base = { path = "crates/mangosteen-base" }
mangosteen-session = { path = "crates/mangosteen-session" }
mangosteen-local = { path = "crates/mangosteen-local" }
mangosteen-backend = { path = "crates/mangosteen-backend" }
mangosteen-cloud = { path = "crates/mangosteen-cloud" }
mangosteen-gateway = { path = "crates/mangosteen-gateway" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
